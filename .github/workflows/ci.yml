name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go vet ./...
      - run: go test -v -race ./...
      - run: go build ./...

  # Go modules publish automatically via the Go module proxy
  # when you push a semver tag. No registry upload needed.
  # Just tag and push:
  #   git tag v0.4.0
  #   git push origin v0.4.0
  #
  # Users install with:
  #   go get github.com/vexis-security/vexis-sdk-go@v0.4.0
  tag-check:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Verify module
        run: |
          go mod verify
          echo "✅ Tag ${{ github.ref_name }} — module will be available via Go proxy shortly"
      - name: Warm proxy cache
        run: |
          GOPROXY=https://proxy.golang.org GO111MODULE=on \
          go list -m github.com/vexis-security/vexis-sdk-go@${{ github.ref_name }} || true
